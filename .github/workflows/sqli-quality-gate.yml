name: SQLi Quality Gate

on:
  push:
    
  pull_request:
    

jobs:
  sqli-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.0'

    - name: Run Engine Tests
      run: go test -v ./pkg/engine/...

    - name: Benchmark Performance
      run: go test -bench=. ./pkg/engine/...
