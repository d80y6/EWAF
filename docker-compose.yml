services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_waf
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_waf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  control-plane:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.cp
    ports:
      - "8081:8081"
    environment:
      - DB_DSN=host=postgres user=sentinel password=sentinel_password dbname=sentinel_waf port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - NATS_URL=nats://nats:4222
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.proxy
    ports:
      - "80:80"
    environment:
      - CONTROL_PLANE_URL=http://control-plane:8081
      - REDIS_ADDR=redis:6379
      - NATS_URL=nats://nats:4222
      - TARGET_URL=http://echo:8080
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      - control-plane

  echo:
    image: ealen/echo-server
    ports:
      - "8080:80"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
