apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-proxy
  template:
    metadata:
      labels:
        app: sentinel-proxy
    spec:
      containers:
      - name: proxy
        image: sentinel-waf/proxy:latest
        ports:
        - containerPort: 80
        env:
        - name: TARGET_URL
          value: "http://backend-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-proxy
spec:
  selector:
    app: sentinel-proxy
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
